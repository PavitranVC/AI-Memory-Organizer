name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 20 and 22 on MongoDB 7 (the version the project targets), plus MongoDB 8, which reports some
    # query plans differently (EXPRESS_IXSCAN)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, mongo: 7 }
          - { node: 22, mongo: 7 }
          - { node: 22, mongo: 8 }

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/aimemory_ci
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/aimemory_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Stage 2 writes run in transactions, which need a replica set. A service container cannot pass
      # --replSet to mongod, so MongoDB is started here as a single-node replica set instead.
      - name: Start MongoDB ${{ matrix.mongo }} as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:${{ matrix.mongo }} --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break; sleep 2; done
      - run: npm ci
      - name: Tests
        run: npm test
      # Smoke test of the real scripts against a fresh database: seed, migrate (a no-op on Stage 2 data, which
      # also proves it is safe to re-run), then check every main query uses an index
      - name: Seed
        run: npm run seed
      - name: Migrate (must be a no-op on a seeded database)
        run: npm run migrate
      - name: Explain (fails on duplicate indexes or collection scans)
        run: npm run explain
      # Stage 3: the extraction worker starts and drains the queue with the mock LLM (the default provider)
      - name: Worker (mock LLM)
        run: npm run worker -- --drain
      # The live smoke test must never call the API in CI: with no key it prints the cost estimate and skips
      - name: Live smoke test (skipped without a key)
        env:
          ANTHROPIC_API_KEY: ''
        run: npm run test:live
      # Stage 5: the real dataset pipeline on the real file. LoCoMo is downloaded (and its SHA-256 checked),
      # loaded twice (the second run must skip every sample), then 10k synthetic memories are generated and
      # the query plans are checked again with the dataset users present
      - name: Download LoCoMo
        run: npm run data:download -- locomo
      - name: Load LoCoMo (twice, to prove it is idempotent)
        run: |
          npm run data:load:locomo
          npm run data:load:locomo | tail -1 | grep -q '"skipped":10'
      - name: Generate 10k synthetic memories
        run: npm run data:synthetic -- --memories 10000
      - name: Dataset counts
        run: npm run data:stats
      - name: Explain (with dataset users present)
        run: npm run explain
      # Stage 4: embed the synthetic memories with the offline lexical embedder (re-running must embed
      # nothing), print the Atlas index definition (no Atlas in CI), and check the retrieval benchmark runs.
      # The benchmark output goes to /tmp: numbers from a shared CI runner are not results.
      - name: Embedding backfill (offline lexical embedder, twice)
        env:
          EMBEDDING_PROVIDER: lexical
        run: |
          npm run embed:backfill
          npm run embed:backfill | tail -1 | grep -q '"embedded":0'
      - name: Atlas index definition (print only)
        run: npm run atlas:index -- --print
      - name: Retrieval benchmark (smoke run, not a result)
        run: npm run bench:retrieval -- --sizes 1000 --queries 20 --out /tmp/stage4-bench
      # Stage 6: the index benchmark and the evaluation harness, as smoke runs on the mock model only (CI never
      # needs an API key). Output goes to /tmp: numbers from a shared CI runner are not results.
      - name: Index benchmark (smoke run, not a result)
        run: npm run bench:indexes -- --sizes 1000 --repeats 3 --out /tmp/stage6-index-bench
      - name: Evaluation harness pipeline check (mock model, not a result)
        env:
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: lexical
        run: npm run eval -- --questions 5 --out /tmp/stage6-eval
      - name: Cost projection (no API calls)
        run: npm run eval:cost -- --out /tmp/stage6-cost-projection
      # Stage 7: the erasure invariants hold on the whole CI database (seed + LoCoMo + synthetic), and the
      # retention job can find expired special memories (dry run: it only counts)
      - name: Erasure verification (every user)
        run: npm run erasure:verify
      - name: Retention (dry run)
        run: npm run retention -- --days 365 --dry-run
