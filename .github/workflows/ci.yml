name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/aimemory_ci
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/aimemory_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      # Smoke test of the real scripts against a fresh database: seed, then check every main query uses an index
      - name: Seed
        run: npm run seed
      - name: Explain (fails on duplicate indexes or collection scans)
        run: npm run explain
